<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0C0C0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reviews">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>CNVS Reviews</title>
<style>
  :root {
    --bg: #0C0C0C; --panel: #101A19; --raised: #142520;
    --accent: #008F6A; --accent-hi: #00A67B; --no: #D2453C;
    --text: #F1F3F6; --text2: #E2E5E7; --muted: #8F8F8F; --line: rgba(143,143,143,.22);
    --wait: #E8B65A; --wait-bg: rgba(217,162,59,.14);
    --chg: #F07A72;  --chg-bg: rgba(210,69,60,.16);
    --ok: #2FC896;   --ok-bg: rgba(0,143,106,.20);
    --exp: #A8A8A8;  --exp-bg: rgba(143,143,143,.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  main { max-width: 720px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { height: 24px; width: auto; display: block; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .icon { margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; font-size: 20px; line-height: 1; }
  .icon.busy span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .icon.busy span { animation-duration: 2.4s; } }

  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; font-weight: 700; letter-spacing: -.015em; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .center { text-align: center; color: var(--muted); padding: 80px 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin: 0 -2px 22px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    font-size: 14px; font-weight: 600; color: var(--text2); }
  .chip b { font-weight: 700; margin-left: 4px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; }
  .chip[aria-pressed="true"] b { color: rgba(255,255,255,.8); }

  .project { margin: 0 0 30px; }
  .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
  .phead h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
  .phead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .small { flex: none; min-height: 36px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised);
    font-size: 13px; font-weight: 600; }

  .clips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .name { font-weight: 650; overflow-wrap: anywhere; }
  .name small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .badge { flex: none; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .b-waiting { color: var(--wait); background: var(--wait-bg); }
  .b-changes { color: var(--chg); background: var(--chg-bg); }
  .b-approved { color: var(--ok); background: var(--ok-bg); }
  .b-expired { color: var(--exp); background: var(--exp-bg); }
  .line { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .line.warn { color: var(--wait); }
  .fb { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--chg); background: rgba(210,69,60,.07); border-radius: 0 10px 10px 0;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text2); font-size: 15px; }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mark { min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised);
    font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .play { min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 0; background: var(--raised); font-size: 14px; font-weight: 600; }
  .gone { color: var(--muted); font-size: 13px; align-self: center; }
  details.hist { margin-top: 10px; }
  details.hist summary { color: var(--muted); font-size: 14px; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
  .old { margin: 8px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); }
  .old .fb { font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  .setup { padding-top: 24px; }
  .lead { color: var(--muted); margin: 0 0 22px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .btn { width: 100%; margin-top: 14px; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  .btn:disabled { opacity: .5; }
  .err { color: var(--chg); margin: 12px 0 0; }
  .banner { background: var(--chg-bg); color: var(--text2); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; font-size: 14px; }

  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .linkish { background: none; border: 0; padding: 6px 0; color: var(--accent-hi); font-size: 13px; }

  dialog { width: min(100vw, 960px); max-width: 100vw; max-height: 100dvh; margin: auto; padding: 0; border: 0; background: #000; color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.85); }
  .pbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px 16px; background: var(--bg); }
  .pbar span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbar button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--raised); font-size: 18px; }
  dialog video { display: block; width: 100%; max-height: calc(100dvh - 140px); background: #000; }
  #pmsg { margin: 0; padding: 40px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="CANVAS" width="102" height="24">
    <span class="tag">Reviews</span>
    <button class="icon" id="refresh" type="button" aria-label="Refresh" hidden><span>↻</span></button>
  </header>
  <div id="app"><p class="center">Loading…</p></div>
  <footer id="foot" hidden>
    <span id="updated"></span>
    <button class="linkish" id="copykey" type="button">Copy key for the home-screen app</button>
    <button class="linkish" id="forget" type="button">Forget key on this phone</button>
  </footer>
</main>

<dialog id="player" aria-label="Play clip">
  <div class="pbar"><span id="ptitle"></span><button id="pclose" type="button" aria-label="Close">✕</button></div>
  <video id="pvideo" controls playsinline preload="metadata"></video>
  <p id="pmsg" hidden></p>
</dialog>

<script>
// CNVS Reviews: the status of every clip sent for review, from anywhere. It talks straight to the "review"
// edge function on Supabase with a studio key, so it needs no Mac and no Tailscale.
const ENDPOINT = "https://nqpbthaweigsrpdyhryr.supabase.co/functions/v1/review";
const CLIENT_PAGE = "https://goozie07.github.io/cnvs-review/";   // the client review page (?b= a batch)
const KEY_STORE = "cnvs-studio-key";

const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

// ------------------------------------------------------------ the studio key
const saved = {
  get() { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem(KEY_STORE, v); } catch {} },
  clear() { try { localStorage.removeItem(KEY_STORE); } catch {} },
};
let key = saved.get();
{ // a setup link carries the key after #key= : keep it on this phone, then take it out of the address bar
  const m = location.hash.match(/[#&]key=([A-Za-z0-9_\-]{32,200})/);
  if (m) { key = m[1]; saved.set(key); history.replaceState(null, "", location.pathname + location.search); }
}

async function studio(body) {
  let r;
  try {
    r = await fetch(ENDPOINT, { method: "POST", cache: "no-store",
      headers: { "content-type": "application/json", "x-studio-key": key }, body: JSON.stringify(body) });
  } catch { throw Object.assign(new Error("Couldn't reach the server. Check your connection and try again."), { kind: "net" }); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw Object.assign(new Error("That key wasn't accepted."), { kind: "key" });
  if (!r.ok || j.error) throw Object.assign(new Error(j.error || "Something went wrong. Please try again."), { kind: "server" });
  return j;
}

// ------------------------------------------------------------ what was sent, clip by clip
let projects = [], filter = "all", loadedAt = 0, loading = false;

const nameOf = p => p.title || (p.file_name || "").replace(/\.[^.]+$/, "") || p.project;
const stateOf = (p, now) => p.status === "approved" ? "approved" : p.status === "changes" ? "changes"
  : new Date(p.expires_at) < now ? "expired" : "waiting";
const time = iso => iso ? +new Date(iso) : 0;

/** The list action's rows → projects, newest activity first, each with the latest version of every clip. */
function organise(data) {
  const now = new Date();
  const clientName = new Map((data.clients || []).map(c => [c.id, c.name]));
  const projectClient = new Map((data.projects || []).map(p => [p.name, clientName.get(p.client_id) || ""]));
  const byClip = new Map();                      // the same clip, version after version (as the client page counts them)
  for (const p of data.previews || []) {
    const k = [p.project, p.folder || "", p.title || p.file_name || ""].join("\u0000");
    if (!byClip.has(k)) byClip.set(k, []);
    byClip.get(k).push(p);
  }
  const out = new Map();
  for (const versions of byClip.values()) {
    versions.sort((a, b) => b.version - a.version);
    const latest = versions[0];
    const pr = out.get(latest.project) ?? { name: latest.project, client: "", clips: [], last: 0, batch: "", batchAt: 0 };
    pr.clips.push({ latest, earlier: versions.slice(1), state: stateOf(latest, now), name: nameOf(latest) });
    for (const v of versions) {
      pr.last = Math.max(pr.last, time(v.created_at), time(v.responded_at));
      if (v.batch && time(v.created_at) >= pr.batchAt) { pr.batch = v.batch; pr.batchAt = time(v.created_at); }
      if (!pr.client && v.client) pr.client = v.client;
    }
    out.set(latest.project, pr);
  }
  const order = { numeric: true, sensitivity: "base" };
  for (const pr of out.values()) {
    pr.client ||= projectClient.get(pr.name) || "";
    pr.clips.sort((a, b) => (a.latest.folder || "").localeCompare(b.latest.folder || "", undefined, order)
      || a.name.localeCompare(b.name, undefined, order));
  }
  return [...out.values()].sort((a, b) => b.last - a.last);
}

// ------------------------------------------------------------ showing it
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date(), mins = Math.round((now - d) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return `today ${t}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `yesterday ${t}`;
  return d.toLocaleDateString([], { day: "numeric", month: "short", ...(d.getFullYear() !== now.getFullYear() && { year: "numeric" }) }) + ` ${t}`;
}
const LABEL = { waiting: "Waiting", changes: "Changes", approved: "Approved", expired: "Expired" };
const FILTERS = [["all", "All"], ["waiting", "Waiting"], ["changes", "Changes"], ["approved", "Approved"], ["unopened", "Not opened"], ["expired", "Expired"]];
const unopened = c => c.state === "waiting" && !c.latest.view_count;
const matches = (c, f) => f === "all" || (f === "unopened" ? unopened(c) : c.state === f);

function answerLine(p) {
  const by = p.responder ? ` by ${esc(p.responder)}` : "";
  if (p.status === "approved") return `Approved${by} · ${when(p.responded_at)}`;
  if (p.status === "changes") return `Changes asked${by} · ${when(p.responded_at)}`;
  return "";
}
function feedbackHTML(p) {
  if (p.status !== "changes" || !p.feedback) return "";
  const marks = (Array.isArray(p.feedback_marks) ? p.feedback_marks : []).filter(m => Number.isFinite(Number(m?.t)));
  return `<div class="fb">${esc(p.feedback)}</div>` + (marks.length && p.storage !== "removed"
    ? `<div class="marks">${marks.map(m => `<button class="mark" type="button" data-play="${esc(p.id)}" data-t="${Number(m.t)}" aria-label="Play from ${esc(m.label)}">${esc(m.label)}</button>`).join("")}</div>` : "");
}

function clipHTML(c) {
  const p = c.latest;
  const folder = p.folder ? `<small>${esc(p.folder)}</small>` : "";
  const opened = p.view_count
    ? `<p class="line">Opened ${p.view_count === 1 ? "once" : p.view_count + " times"} · first ${when(p.first_viewed_at)}</p>`
    : `<p class="line${c.state === "waiting" ? " warn" : ""}">Not opened yet · sent ${when(p.created_at)}</p>`;
  const answer = answerLine(p);
  const expired = c.state === "expired" ? `<p class="line">Link expired ${when(p.expires_at)}</p>` : "";
  const play = p.storage === "removed" ? `<span class="gone">Video removed</span>`
    : `<button class="play" type="button" data-play="${esc(p.id)}" data-t="0">▶ Play v${p.version}</button>`;
  const hist = c.earlier.length ? `<details class="hist"><summary>Earlier versions (${c.earlier.length})</summary>${c.earlier.map(o => {
    const st = stateOf(o, new Date());
    return `<div class="old"><div class="top"><span class="name">v${o.version}</span><span class="badge b-${st}">${LABEL[st]}</span></div>
      ${answerLine(o) ? `<p class="line">${answerLine(o)}</p>` : `<p class="line">Sent ${when(o.created_at)}</p>`}${feedbackHTML(o)}</div>`;
  }).join("")}</details>` : "";
  return `<li class="clip">
    <div class="top"><span class="name">${folder}${esc(c.name)}</span><span class="badge b-${c.state}">${LABEL[c.state]}</span></div>
    ${opened}${answer ? `<p class="line">${answer}</p>` : ""}${expired}
    ${feedbackHTML(p)}
    <div class="acts">${play}</div>${hist}</li>`;
}

function render() {
  const all = projects.flatMap(pr => pr.clips);
  const count = f => all.filter(c => matches(c, f)).length;
  const chips = FILTERS.filter(([f]) => f === "all" || count(f) > 0 || f === filter)
    .map(([f, label]) => `<button class="chip" type="button" data-filter="${f}" aria-pressed="${f === filter}">${label}<b>${count(f)}</b></button>`).join("");
  const shown = projects.map(pr => ({ ...pr, clips: pr.clips.filter(c => matches(c, filter)) })).filter(pr => pr.clips.length);
  app.innerHTML = `<h1>Your reviews</h1>
    <p class="meta">${all.length} clips in ${projects.length} project${projects.length === 1 ? "" : "s"} · latest version of each</p>
    <div id="banner"></div>
    <div class="chips" role="group" aria-label="Show">${chips}</div>
    ${shown.length ? shown.map(pr => {
      const TALLY = { waiting: "waiting", changes: "changes asked", approved: "approved", expired: "expired" };
      const tally = Object.keys(TALLY).map(s => [s, pr.clips.filter(c => c.state === s).length])
        .filter(([, n]) => n).map(([s, n]) => `${n} ${TALLY[s]}`).join(" · ");
      return `<section class="project">
        <div class="phead"><div><h2>${esc(pr.name)}</h2><p>${pr.client ? esc(pr.client) + " · " : ""}${tally}</p></div>
          ${pr.batch ? `<button class="small" type="button" data-copy="${esc(CLIENT_PAGE + "?b=" + encodeURIComponent(pr.batch))}">Copy client link</button>` : ""}</div>
        <ul class="clips">${pr.clips.map(clipHTML).join("")}</ul></section>`;
    }).join("") : `<p class="empty">${all.length ? "Nothing here right now." : "No reviews sent yet."}</p>`}`;
  $("refresh").hidden = false;
  $("foot").hidden = false;
  $("copykey").hidden = standalone;
  stamp();
}
function stamp() { if (loadedAt) $("updated").textContent = `Updated ${when(new Date(loadedAt).toISOString())}`; }

function setup(message = "") {
  $("refresh").hidden = true;
  $("foot").hidden = true;
  app.innerHTML = `<section class="setup">
    <h1>Check your reviews</h1>
    <p class="lead">Open the setup link on this phone, or paste a CNVS studio key. It stays on this phone only.</p>
    <form id="keyform">
      <label for="k">Studio key</label>
      <input id="k" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required minlength="32">
      <button class="btn" type="submit">Show my reviews</button>
      <p class="err" id="err" ${message ? "" : "hidden"}>${esc(message)}</p>
    </form></section>`;
  $("keyform").addEventListener("submit", e => {
    e.preventDefault();
    key = $("k").value.trim();
    saved.set(key);
    load();
  });
}

async function load() {
  if (!key) return setup();
  if (loading) return;
  loading = true;
  $("refresh").classList.add("busy");
  try {
    projects = organise(await studio({ action: "list" }));
    loadedAt = Date.now();
    render();
  } catch (e) {
    if (e.kind === "key") { saved.clear(); key = ""; setup("That key wasn't accepted. Check it and try again."); }
    else if (loadedAt) { const b = $("banner"); if (b) b.innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
    else {
      app.innerHTML = `<p class="center">${esc(e.message)}<br><br><button class="small" type="button" id="retry">Try again</button></p>`;
      $("retry").addEventListener("click", load);
    }
  } finally {
    loading = false;
    $("refresh").classList.remove("busy");
  }
}

// ------------------------------------------------------------ playing a clip (as the studio: not counted as the client watching)
const player = $("player"), video = $("pvideo"), pmsg = $("pmsg");
async function play(id, t) {
  const c = projects.flatMap(pr => pr.clips.flatMap(c => [c.latest, ...c.earlier])).find(p => p.id === id);
  $("ptitle").textContent = c ? `${nameOf(c)} · v${c.version}` : "Clip";
  video.hidden = true; pmsg.hidden = false; pmsg.textContent = "Loading…";
  player.showModal();
  try {
    const r = await studio({ action: "watch", id });
    if (!player.open) return;
    if (r.removed || !r.video_url) { pmsg.textContent = "This video has been removed. The client's answer and notes are still here."; return; }
    video.src = r.video_url;
    video.hidden = false; pmsg.hidden = true;
    video.addEventListener("loadedmetadata", () => { if (t > 0) video.currentTime = t; video.play().catch(() => {}); }, { once: true });
  } catch (e) { pmsg.textContent = e.message; }
}
function closePlayer() { video.pause(); video.removeAttribute("src"); video.load(); if (player.open) player.close(); }
$("pclose").addEventListener("click", closePlayer);
player.addEventListener("cancel", e => { e.preventDefault(); closePlayer(); });
player.addEventListener("click", e => { if (e.target === player) closePlayer(); });

// ------------------------------------------------------------ taps
app.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.filter) { filter = b.dataset.filter; render(); }
  else if (b.dataset.play) play(b.dataset.play, Number(b.dataset.t) || 0);
  else if (b.dataset.copy) copy(b, b.dataset.copy, "Copied");
});
async function copy(button, text, done) {
  const before = button.textContent;
  try { await navigator.clipboard.writeText(text); button.textContent = done; }
  catch { prompt("Copy this:", text); }
  setTimeout(() => { button.textContent = before; }, 1600);
}
$("refresh").addEventListener("click", load);
$("copykey").addEventListener("click", e => copy(e.currentTarget, key, "Key copied: paste it in the home-screen app"));
$("forget").addEventListener("click", () => {
  if (!confirm("Forget the studio key on this phone? You'll need the setup link or the key to get back in.")) return;
  saved.clear(); key = ""; projects = []; loadedAt = 0; setup();
});
document.addEventListener("visibilitychange", () => {      // back on the page after a while: fetch the latest
  if (!document.hidden && key && Date.now() - loadedAt > 60000) load();
});
setInterval(stamp, 30000);

load();
</script>
</body>
</html>
