<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview for review</title>
<style>
  :root {
    --bg: #0C0C0C; --panel: #101A19; --raised: #142520;
    --accent: #008F6A; --accent-hi: #00A67B; --no: #D2453C; --no-hi: #E3564D;
    --text: #F1F3F6; --text2: #E2E5E7; --muted: #8F8F8F; --line: rgba(143,143,143,.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
  main.wide { max-width: 1320px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  header img { height: 26px; display: block; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.2; margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; }
  .meta { color: var(--muted); margin: 0 0 18px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    margin: 0 0 18px; white-space: pre-wrap; color: var(--text2); }
  .tally { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .pill { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 4px 11px; background: var(--raised);
    border: 1px solid var(--line); color: var(--text2); }
  .pill.y { background: var(--accent); border-color: transparent; color: #fff; }
  .pill.n { background: var(--no); border-color: transparent; color: #fff; }

  .items { display: grid; gap: 18px; }
  .items.many { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items: start; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .items.one .item { background: none; border: 0; padding: 0; }
  .item h3 { margin: 2px 4px 10px; font-size: 15px; font-weight: 650; display: flex; justify-content: space-between; gap: 10px; }
  .item h3 span { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .player { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  video { display: block; width: 100%; max-height: 72vh; background: #000; }
  .items.many video { max-height: 62vh; }

  .ask { margin-top: 14px; }
  .items.one .ask { margin-top: 26px; }
  .ask h2 { font-size: 20px; margin: 0 0 14px; font-weight: 650; }
  .items.many .ask h2 { display: none; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .big { padding: 16px 12px; font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center;
    justify-content: center; gap: 8px; transition: transform .06s ease, background .15s ease, opacity .15s; }
  .items.one .big { padding: 18px 16px; font-size: 18px; }
  .big:active { transform: scale(.985); }
  .yes { background: var(--accent); } .yes:hover { background: var(--accent-hi); }
  .no { background: var(--no); } .no:hover { background: var(--no-hi); }
  .choices.picked .big:not(.on) { opacity: .35; }
  .form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .items.many .form { background: var(--bg); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .items.many textarea, .items.many input[type=text] { background: var(--panel); }
  textarea { min-height: 150px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 14px; flex-wrap: wrap; }
  .small { background: var(--raised); color: var(--text); padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); }
  .count { color: var(--muted); font-size: 13px; } .count.ok { color: var(--accent-hi); }
  .send { margin-top: 14px; width: 100%; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .err { color: var(--no-hi); margin-top: 10px; }
  .done { text-align: center; padding: 22px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .items.many .done { background: var(--bg); }
  .done .mark { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px;
    font-size: 24px; font-weight: 800; color: #fff; }
  .done h2 { display: block !important; margin: 0 0 4px; font-size: 19px; }
  .done p { color: var(--muted); margin: 0; }
  .quote { text-align: left; white-space: pre-wrap; margin: 14px 0 0; color: var(--text2); }
  .gone { color: var(--muted); padding: 30px 10px; text-align: center; }
  .center { text-align: center; padding: 80px 16px; color: var(--muted); }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (max-width: 560px) { .items.one .choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="main">
  <header>
    <img src="logo.png" alt="CANVAS">
    <span class="tag">Preview</span>
  </header>
  <div id="app"><p class="center">Loading your preview…</p></div>
  <footer>This is a private preview link. Please don't share it.</footer>
</main>
<script>
const ENDPOINT = "https://nqpbthaweigsrpdyhryr.supabase.co/functions/v1/review";
const params = new URLSearchParams(location.search);
const token = params.get("t") || "", batch = params.get("b") || "";
const app = document.getElementById("app");
let page = null;          // { project, client, note, min_feedback, items: [{ token, title, version, status, ... }] }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function call(body) {
  try {
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok && !j.error) j.error = "Something went wrong. Please try again.";
    return j;
  } catch { return { error: "Couldn't reach the server. Check your connection and try again." }; }
}
const stamp = t => { t = Math.floor(t || 0); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const many = () => page.items.length > 1;
const min = () => page.min_feedback || 20;

function render() {
  const n = page.items.length;
  const yes = page.items.filter(i => i.status === "approved").length;
  const no = page.items.filter(i => i.status === "changes").length;
  const left = page.items.filter(i => i.status === "waiting" && !i.expired).length;
  const one = page.items[0];
  document.getElementById("main").classList.toggle("wide", many());
  app.innerHTML = `
    <h1>${esc(page.project)}</h1>
    <p class="meta">${many() ? `${n} clips to review` : `Version ${one.version}`}${page.client ? " · for " + esc(page.client) : ""}</p>
    ${page.note ? `<div class="note">${esc(page.note)}</div>` : ""}
    ${many() ? `<div class="tally" id="tally"></div>` : ""}
    <div class="items ${many() ? "many" : "one"}">${page.items.map((it, i) => card(it, i)).join("")}</div>`;
  page.items.forEach((it, i) => wire(i));
  tally();
}

function tally() {
  const el = document.getElementById("tally"); if (!el) return;
  const yes = page.items.filter(i => i.status === "approved").length;
  const no = page.items.filter(i => i.status === "changes").length;
  const left = page.items.length - yes - no;
  el.innerHTML = (left ? `<span class="pill">${left} still to answer</span>` : `<span class="pill">All answered, thank you</span>`)
    + (yes ? `<span class="pill y">${yes} approved</span>` : "") + (no ? `<span class="pill n">${no} need changes</span>` : "");
}

function card(it, i) {
  const head = many() ? `<h3>${esc(it.title || "Clip " + (i + 1))}<span>v${it.version}</span></h3>` : "";
  if (it.expired) return `<div class="item">${head}<p class="gone">This preview has expired. Ask us for a new link.</p></div>`;
  return `<div class="item" id="item${i}">${head}
    <div class="player"><video id="video${i}" controls playsinline preload="metadata" src="${esc(it.video_url)}"></video></div>
    <section class="ask" id="ask${i}">${it.status === "waiting" ? askHTML(it, i) : answered(it)}</section></div>`;
}

function askHTML(it, i) {
  return `<h2>Are you happy with this version?</h2>
    <div class="choices" id="choices${i}">
      <button class="big yes" data-c="approved">✓ ${many() ? "Yes" : "Yes, approve"}</button>
      <button class="big no" data-c="changes">✕ ${many() ? "No" : "No, needs changes"}</button>
    </div>
    <div id="form${i}"></div>`;
}

function answered(it) {
  const yes = it.status === "approved";
  return `<div class="done">
    <div class="mark" style="background:${yes ? "var(--accent)" : "var(--no)"}">${yes ? "✓" : "✕"}</div>
    <h2>${yes ? "Approved" : "Changes requested"}</h2>
    <p>${yes ? "Thank you. We'll take this to final." : "Thank you. We'll work through your notes and send a new version."}${it.responder ? "<br>— " + esc(it.responder) : ""}</p>
    ${!yes && it.feedback ? `<div class="quote note">${esc(it.feedback)}</div>` : ""}
  </div>`;
}

function wire(i) {
  const ch = document.getElementById("choices" + i); if (!ch) return;
  ch.querySelectorAll("[data-c]").forEach(b => b.onclick = () => pick(i, b.dataset.c));
}

let lastName = "";
function pick(i, c) {
  const it = page.items[i]; it.choice = c;
  const ch = document.getElementById("choices" + i);
  ch.classList.add("picked");
  ch.querySelectorAll(".big").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  const form = document.getElementById("form" + i);
  if (c === "approved") {
    form.innerHTML = `<div class="form">
      <p class="hint" style="margin:0 0 12px">Approving tells us this ${many() ? "clip" : "version"} is final.</p>
      <label for="name${i}">Your name</label>
      <input type="text" id="name${i}" autocomplete="name" placeholder="So we know who signed off" value="${esc(lastName)}">
      <button class="send yes" id="send${i}">Approve${many() ? "" : " version " + it.version}</button>
      <div class="err" id="err${i}"></div></div>`;
  } else {
    form.innerHTML = `<div class="form">
      <label for="fb${i}">What needs to change?</label>
      <p class="hint">Be specific. Pause where something needs changing and press <b>Add time</b> so we know exactly where you mean.</p>
      <textarea id="fb${i}" placeholder="e.g. 0:12 – swap this shot for the wide one&#10;0:30 – music too loud under the speech"></textarea>
      <div class="row"><button class="small" id="time${i}">+ Add time</button><span class="count" id="count${i}">0 / ${min()} characters minimum</span></div>
      <label for="name${i}">Your name</label>
      <input type="text" id="name${i}" autocomplete="name" placeholder="So we know who the notes are from" value="${esc(lastName)}">
      <button class="send no" id="send${i}" disabled>Send changes</button>
      <div class="err" id="err${i}"></div></div>`;
    const fb = document.getElementById("fb" + i), count = document.getElementById("count" + i), send = document.getElementById("send" + i);
    const update = () => { const n = fb.value.trim().length; count.textContent = `${n} / ${min()} characters minimum`;
      count.classList.toggle("ok", n >= min()); send.disabled = n < min(); };
    fb.oninput = update;
    document.getElementById("time" + i).onclick = () => {
      const v = document.getElementById("video" + i); v.pause();
      const pre = fb.value && !fb.value.endsWith("\n") ? "\n" : "";
      fb.value += pre + stamp(v.currentTime) + " – "; fb.focus(); fb.setSelectionRange(fb.value.length, fb.value.length); update();
    };
    setTimeout(() => fb.focus(), 50);
  }
  document.getElementById("send" + i).onclick = () => submit(i);
  form.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function submit(i) {
  const it = page.items[i];
  const send = document.getElementById("send" + i), err = document.getElementById("err" + i);
  const fb = document.getElementById("fb" + i), name = document.getElementById("name" + i).value.trim();
  send.disabled = true; err.textContent = "";
  const j = await call({ action: "respond", token: it.token, decision: it.choice, feedback: fb ? fb.value : "", name });
  if (j.error) { err.textContent = j.error; send.disabled = false; return; }
  lastName = name;
  it.status = it.choice; it.feedback = fb ? fb.value.trim() : ""; it.responder = name;
  document.getElementById("ask" + i).innerHTML = answered(it);
  tally();
}

(async () => {
  if (!token && !batch) { app.innerHTML = `<p class="center">This preview link is missing its code. Please use the full link you were sent.</p>`; return; }
  const j = batch ? await call({ action: "batch", batch }) : await call({ action: "view", token });
  if (j.error) { app.innerHTML = `<p class="center">${esc(j.error)}</p>`; return; }
  if (j.expired) { app.innerHTML = `<p class="center">This preview of ${esc(j.project)} has expired. Ask us for a new link.</p>`; return; }
  page = batch ? j : { project: j.project, client: j.client, note: j.note, min_feedback: j.min_feedback, items: [{ ...j, token }] };
  page.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", undefined, { numeric: true, sensitivity: "base" }));
  document.title = many() ? `${page.project} – ${page.items.length} clips` : `${page.project} – Version ${page.items[0].version}`;
  render();
})();
</script>
</body>
</html>
